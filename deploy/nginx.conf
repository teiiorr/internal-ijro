# =============================================================================
# Ichki Ijro — nginx reverse proxy (REFERENCE CONFIG, versioned in the repo).
#
# ⚠ THIS IS REFERENCE, NOT NECESSARILY WHAT'S LIVE. The running server's config
#   (at /etc/nginx/sites-available/) may have been edited in place — by certbot
#   (TLS lines) or by hand. Treat this file as the intended, reviewed baseline;
#   diff it against the server before assuming they match. Apply with:
#       sudo cp deploy/nginx.conf /etc/nginx/sites-available/markaz-ijro
#       sudo ln -sf /etc/nginx/sites-available/markaz-ijro /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d app.markaz-ijro.uz   # first time only
#
#   Replace app.markaz-ijro.uz below if the domain differs.
# =============================================================================

# gzip for text-ish responses. Next already pre-compresses static assets, so we
# keep the set small and skip anything already binary/compressed (images, fonts).
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types        text/plain text/css application/javascript application/json
                  application/xml image/svg+xml application/manifest+json;

# Upstream app (Next.js systemd unit `markaz-ijro`, listening on loopback).
upstream ichki_ijro_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS. certbot rewrites/extends this block when it issues certs.
server {
    listen 80;
    listen [::]:80;
    server_name app.markaz-ijro.uz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.markaz-ijro.uz;

    # certbot fills these in on first run:
    # ssl_certificate     /etc/letsencrypt/live/app.markaz-ijro.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.markaz-ijro.uz/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Must be >= MAX_UPLOAD_BYTES in .env.production (default there is 100 MiB).
    client_max_body_size 110M;

    # --- Security headers --------------------------------------------------
    # NOTE: the app ALSO sets X-Frame-Options / X-Content-Type-Options /
    # Referrer-Policy / Permissions-Policy / a full CSP in next.config.ts
    # (headers()). To avoid conflicting/duplicate headers, the canonical set
    # lives there. HSTS is the one header nginx should own, because it must be
    # sent even for non-app responses (e.g. this maintenance page) and only
    # makes sense once TLS is confirmed working — enable it after certbot:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Never cache HTML documents; Next controls asset caching via headers.
    add_header Cache-Control "no-store" always;

    # --- App ---------------------------------------------------------------
    location / {
        proxy_pass         http://ichki_ijro_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # WebSocket/upgrade passthrough (used by HMR in dev; harmless in prod).
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Serve the maintenance page instead of a raw nginx error when the app
        # is down / restarting (deploys, OOM restart, crash loop).
        proxy_intercept_errors on;
        error_page 502 503 504 = @maintenance;
    }

    # --- Server-Sent Events: live notifications stream ---------------------
    # SSE is a long-lived streaming response. Buffering would hold events back
    # until the buffer fills (or never flush), so the client sees nothing live.
    # Turn buffering OFF and give it a long read timeout so nginx doesn't cut
    # the idle-but-open stream.
    location /api/notifications/stream {
        proxy_pass            http://ichki_ijro_app;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";   # keep-alive, not "upgrade"

        proxy_buffering       off;      # <-- the important bit for SSE
        proxy_cache           off;
        proxy_read_timeout    1h;       # don't drop a quiet-but-open stream
        chunked_transfer_encoding off;
        # Belt-and-braces: some proxies honour this hint to never buffer.
        add_header            X-Accel-Buffering no;
    }

    # --- Static assets — long, immutable cache -----------------------------
    location /_next/static/ {
        proxy_pass http://ichki_ijro_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Maintenance fallback ----------------------------------------------
    # Static HTML served straight from disk so it works even when the app is
    # completely down. Create /var/www/maintenance/index.html on the server
    # (a simple "Служба временно недоступна / Xizmat vaqtincha ishlamayapti").
    location @maintenance {
        root /var/www/maintenance;
        rewrite ^ /index.html break;
        add_header Retry-After 30 always;
        default_type text/html;
    }
}
